server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # CORS & caching headers for chatbot assets so other websites can embed Botly
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|webp)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Clean page URLs (internal rewrites keep the pretty address;
    # query strings like ?view=webhooks are preserved).
    # NOTE: /contact and /admin resolve via try_files $uri.html below.
    rewrite ^/studio/?$ /demo/customizer.html last;
    rewrite ^/docs/?$ /demo/docs.html last;
    rewrite ^/example/?$ /demo/embed-example.html last;
    rewrite ^/demo/?$ /demo.html last;

    # Payment-return page: forgive the /studio or /demo prefix typo and
    # the trailing slash (without this, try_files serves index.html
    # under the wrong path and relative CSS breaks -> unstyled page).
    rewrite ^/studio/activated(\.html)?/?$ /activated permanent;
    rewrite ^/demo/activated(\.html)?/?$ /activated permanent;
    rewrite ^/activated/$ /activated.html last;

    # Live API (/api/*): served from botly-api-active.conf, managed by
    # docker-entrypoint.sh — proxies to SCRAPER_BACKEND_URL when set,
    # otherwise answers JSON 503 (never the SPA fallback HTML).
    include /etc/nginx/botly-api-active.conf;

    # Clean URL routing & fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Health check endpoint for Northflank monitoring
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 404 fallback
    error_page 404 /index.html;
}
