# Default live-API block (no scraper backend configured).
# Answers /api/* with JSON — never the SPA fallback HTML — so Studio/clients
# get a parseable error instead of a "<!DOCTYPE ..." SyntaxError.
# Overwritten with a proxy_pass block by docker-entrypoint.sh when
# SCRAPER_BACKEND_URL is set.
location /api/ {
    access_log off;
    add_header Content-Type application/json always;
    return 503 '{"found":false,"error":"Live API backend not configured on this deployment","hint":"Set SCRAPER_BACKEND_URL to a running Botly scraper service (see Dockerfile.scraper)."}';
}
